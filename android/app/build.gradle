apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "io.fightbase.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.fightbase.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 1 liegt bereits im internen Test-Track. Play verlangt
        // eine streng steigende Zahl, sonst wird das naechste AAB abgelehnt.
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Nur zuweisen, wenn der Block oben auch gefuellt wurde. Fehlt
            // keystore.properties, blieb signingConfigs.release leer und wurde
            // trotzdem benutzt — siehe die Pruefung unter diesem Block.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Ohne keystore.properties lief ein Release-Build zwanzig Sekunden durch und
// brach dann in :app:signReleaseBundle mit einer nackten NullPointerException
// ab — ohne jeden Hinweis darauf, dass schlicht eine Datei fehlt. Diese
// Pruefung sagt stattdessen, was fehlt, bevor irgendetwas gebaut wird.
//
// Debug-Builds sind nicht betroffen: Die signiert Android Studios
// Debug-Keystore, und der wird bei Bedarf selbst angelegt.
gradle.taskGraph.whenReady { graph ->
    def signsRelease = graph.allTasks.any { it.name == 'signReleaseBundle' || it.name == 'packageRelease' }
    if (signsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "android/keystore.properties fehlt - ohne sie laesst sich kein Release signieren.\n" +
            "\n" +
            "Die Datei ist gitignored und existiert nur lokal. Sie braucht vier Zeilen:\n" +
            "  storeFile=app/fightbase-release.jks\n" +
            "  storePassword=<Passwort des Keystores>\n" +
            "  keyAlias=<Alias>\n" +
            "  keyPassword=<Passwort des Schluessels>\n" +
            "\n" +
            "Fehlt auch app/fightbase-release.jks: Der Upload-Schluessel laesst sich\n" +
            "in der Play Console zuruecksetzen (Setup -> App integrity). Der\n" +
            "App-Signaturschluessel liegt bei Google und geht dabei nicht verloren.\n" +
            "\n" +
            "Nur testen, ohne Signatur? ./gradlew assembleDebug baut eine APK, die\n" +
            "sich installieren laesst."
        )
    }
}

// Die Offline-Seite muss im Build liegen, sonst zeigt die App bei fehlender
// Verbindung Chromes Fehlerseite samt Adresszeile.
//
// Capacitor loest server.errorPath zu "https://localhost/error.html" auf
// (Bridge.getErrorUrl()) und laesst das vom eigenen lokalen Server aus
// app/src/main/assets/public/ ausliefern. Genau dieser Ordner steht in
// android/.gitignore — er entsteht erst durch `npx cap sync android`. Ein
// frischer Checkout baut also eine App ohne Offline-Seite, ohne dass
// irgendetwas warnt.
//
// Genau so ist es passiert: Auf dem Emulator lief alles ausser der
// Offline-Seite, weil der letzte Sync aelter war als native-web/error.html.
// Deshalb prueft der Vergleich unten auch den Inhalt und nicht nur, ob die
// Datei da ist.
gradle.taskGraph.whenReady { graph ->
    def buildsApp = graph.allTasks.any { it.name.startsWith('package') || it.name.startsWith('bundle') }
    if (!buildsApp) return

    def hint = "\n\nBeheben mit:\n  npx cap sync android\n\n" +
        "Der Ordner app/src/main/assets/public/ ist gitignored (Capacitors\n" +
        "eigene Vorlage) und entsteht erst durch den Sync. Nach jeder Aenderung\n" +
        "an native-web/ muss er neu laufen, sonst baut Gradle die alte Fassung\n" +
        "mit ein."

    def syncedConfig = file('src/main/assets/capacitor.config.json')
    if (!syncedConfig.exists()) {
        throw new GradleException("capacitor.config.json fehlt im Build." + hint)
    }

    def source = rootProject.file('../native-web/error.html')
    def synced = file('src/main/assets/public/error.html')
    if (!synced.exists()) {
        throw new GradleException(
            "Die Offline-Seite fehlt im Build (app/src/main/assets/public/error.html).\n" +
            "Die App wuerde bei fehlender Verbindung Chromes Fehlerseite zeigen." + hint
        )
    }
    if (source.exists() && source.text != synced.text) {
        throw new GradleException(
            "Die Offline-Seite im Build ist nicht die aus native-web/error.html.\n" +
            "Der letzte Sync ist aelter als die Datei." + hint
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
