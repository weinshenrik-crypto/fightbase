<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fightbase</title>
    <!--
      Diese Datei existiert nur, weil Capacitor im webDir eine Einstiegsseite
      erwartet. Im Betrieb wird sie nie gezeigt — server.url in
      capacitor.config.ts zeigt auf die Live-Seite. Inhaltlich dieselbe Seite
      wie error.html, damit ein unerwarteter Aufruf nicht weiss aufblitzt.

      Bewusst ohne Schriftdatei und ohne Skript von aussen: Sie wird genau dann
      gebraucht, wenn nichts geladen werden kann. Farben und Schriftgroessen
      sind von Hand aus tailwind.config.ts uebernommen, weil hier kein Tailwind
      laeuft.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0c0c0d;
        color: #edeae4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 22rem; text-align: left; }
      .mark {
        width: 44px; height: 44px; border-radius: 10px;
        background: #c1272d; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 20px; letter-spacing: .02em;
        margin-bottom: 20px;
      }
      h1 { font-size: 20px; line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
      p { font-size: 14px; line-height: 1.55; color: #b7b7ba; margin: 0 0 6px; }
      p.de { color: #8a8a8e; margin-bottom: 22px; }
      button {
        font: inherit; font-weight: 600; font-size: 14px;
        color: #fff; background: #c1272d;
        border: 0; border-radius: 8px; padding: 11px 20px;
        cursor: pointer;
      }
      button:active { background: #a52026; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>No connection</h1>
      <p>Fightbase loads its events from the web. Check your connection and try again.</p>
      <p class="de">Keine Verbindung. Fightbase lädt seine Termine aus dem Netz — prüf die Verbindung und versuch es noch einmal.</p>
      <button type="button" onclick="location.replace('https://fightbase.io/')">
        Try again · Erneut versuchen
      </button>
    </main>
  </body>
</html>
