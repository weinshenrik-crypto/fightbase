name: CI

# Vercel deployt direkt aus main, und die Android-App laedt die Live-Seite per
# WebView (capacitor.config.ts zeigt mit server.url auf fightbase.io). Ein
# kaputter Build nimmt also Website und App gleichzeitig mit. Hier laufen die
# Checks, die man sonst lokal laufen laesst, bevor das passiert.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Prueft getEventBySlug() gegen ein gestubbtes fetch — unter anderem, dass
      # die Einzelabfrage kein cache:"no-store" benutzt. Mit no-store kippt die
      # Detailseite beim On-demand-Rendern von statisch auf dynamisch, und jeder
      # unbekannte Slug antwortet mit 500 statt 404.
      - name: Event-Lookup pruefen
        run: npx tsx scripts/check-event-lookup.ts

      # Die UWW-Quelle liest den ld+json-Block der Seite, weil deren Tabelle
      # erst im Browser gefuellt wird. Der Test laeuft gegen eine gestubbte
      # Seite, braucht also kein Netz.
      - name: UWW-Quelle pruefen
        run: npx tsx scripts/check-uww-source.ts

      # Der Wikipedia-Parser fuer Ergebnisse, gegen feste Wikitext-Schnipsel
      # statt gegen Wikipedia — laeuft also ohne Netz. Prueft unter anderem,
      # dass Klammern nur aus Namen fallen und nicht aus der Methode.
      - name: Ergebnis-Parser pruefen
        run: npx tsx scripts/check-results-source.ts

      # Haelt das Farb-System zusammen: keine rohen Hex-Werte in Tailwind-Klassen
      # und jede Textfarbe ueber 4.5:1. Zwei Werte waren genau so am System
      # vorbeigelaufen und lagen bei 2.66:1 und 2.07:1.
      - name: Farb-Tokens pruefen
        run: npx tsx scripts/check-design-tokens.ts

      # Die erste zweistufige Quelle: Sitemap, dann jede Einzelseite. Bricht
      # Stufe zwei still, meldet sie "0 neue Events" statt eines Fehlers.
      # Laeuft gegen gestubbte Antworten, braucht also kein Netz.
      - name: ONE-Quelle pruefen
        run: npx tsx scripts/check-one-source.ts

      # Zwei Namen fuer denselben Veranstalter. Dreimal passiert (IJF, WKF,
      # ONE), jedes Mal entstanden zwei duenne Promotion-Seiten. Die Erkennung
      # prueft sich zuerst selbst gegen diese drei Faelle — das laeuft ohne
      # Netz. Der Abgleich mit der Tabelle laeuft nur mit hinterlegten
      # Secrets und wird sonst uebersprungen.
      - name: Promotion-Namen pruefen
        run: npx tsx scripts/check-promotion-names.ts

      # Die Offline-Seite der Android-App. Prueft, dass der Riegel in
      # android/app/build.gradle noch da ist (ohne ihn baut ein frischer
      # Checkout stillschweigend eine App ohne Offline-Seite) und dass die
      # Seite selbst ohne Ressourcen von aussen auskommt. Braucht weder Netz
      # noch Android SDK.
      - name: Offline-Seite der App pruefen
        run: npx tsx scripts/check-android-offline-page.ts

      # Jeder Host im autoVerify-Filter muss bei Googles Pruefdienst verknuepft
      # sein. Auf Android 11 und aelter reisst ein fehlschlagender Host die
      # Verifizierung aller anderen mit — die Deep Links waeren dort komplett
      # tot, ohne dass irgendetwas warnt. Ist der Dienst nicht erreichbar,
      # wird der Teil uebersprungen statt rot zu werden.
      - name: App-Links pruefen
        run: npx tsx scripts/check-app-links.ts

      # Blockierend, seit die acht set-state-in-effect-Fehler weg sind.
      # Warnungen bleiben Warnungen — eslint beendet sich dafuer mit 0.
      - name: Lint
        run: npm run lint

      # Der Build braucht eine erreichbare Supabase-Instanz: die Fighter-Seite
      # holt ihre Params ueber die Datenbank und bricht den ganzen Build ab,
      # wenn der Request fehlschlaegt. Platzhalterwerte reichen deshalb nicht.
      # Ohne hinterlegte Secrets wird der Schritt uebersprungen statt rot zu
      # werden — Typecheck und Lint laufen dann trotzdem.
      # Anlegen unter: Settings -> Secrets and variables -> Actions.
      # Beides sind die oeffentlichen NEXT_PUBLIC_-Werte, kein Service-Role-Key.
      - name: Build
        if: env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != ''
        run: npm run build

      - name: Build uebersprungen
        if: env.NEXT_PUBLIC_SUPABASE_URL == '' || env.NEXT_PUBLIC_SUPABASE_ANON_KEY == ''
        run: |
          echo "::warning::Build uebersprungen — NEXT_PUBLIC_SUPABASE_URL und NEXT_PUBLIC_SUPABASE_ANON_KEY sind nicht als Repository-Secrets hinterlegt."
